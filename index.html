<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dosa</title>
<meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141916" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dosa">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root {
  --bg: #f6f3ec; --card: #fffdf9; --text: #243029; --muted: #717b74; --line: #ebe6dc; --card-border: transparent;
  --accent: #4f8a6b; --accent-soft: #e3efe6; --warn: #ad5f28; --warn-soft: #fbefe3; --danger: #b3261e;
  --c-morning: #d99a2b; --c-day: #3f9a8f; --c-energy: #dc6a55; --c-evening: #7a72c6;
  --shadow: 0 1px 2px rgba(70, 60, 30, .05), 0 6px 18px rgba(70, 60, 30, .06);
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #141916; --card: #1c231f; --text: #e7ece8; --muted: #9ba69f; --line: #2b332e; --card-border: #29312c;
    --accent: #82c29e; --accent-soft: #1f3328; --warn: #e9a46e; --warn-soft: #3a2b1f; --danger: #f28b82;
    --c-morning: #efb95c; --c-day: #5fbcb0; --c-energy: #ef8a77; --c-evening: #a39de6; --shadow: none; }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
body { padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: calc(8px + env(safe-area-inset-top)) 18px 6px;
  display: flex; align-items: center; justify-content: space-between; gap: 8px; }
header h1 { font-size: 19px; margin: 0; letter-spacing: -.01em; }
header h1 span { color: var(--accent); }
#syncState { border: 0; background: none; color: var(--muted); font: inherit; font-size: 13px; padding: 4px 0; }
main { max-width: 640px; margin: 0 auto; padding: 4px 16px 12px; }
nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 5; display: flex; background: var(--card);
  border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
nav button { flex: 1; min-width: 0; border: 0; background: none; color: var(--muted); padding: 9px 2px 11px; font: inherit; font-size: 12px; }
nav button span { display: block; font-size: 20px; line-height: 1.2; filter: grayscale(.6); opacity: .8; }
nav button.on { color: var(--accent); font-weight: 600; }
nav button.on span { filter: none; opacity: 1; }
.card { background: var(--card); border: 1px solid var(--card-border); border-radius: 20px; box-shadow: var(--shadow); padding: 6px 16px; margin-bottom: 14px; }
.card.pad { padding: 14px 16px; }
h2 { font-size: 18px; margin: 4px 0 10px; }
h3 { font-size: 12px; margin: 14px 0 4px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.muted { color: var(--muted); font-size: 14px; }
.small { font-size: 13px; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.daynav { display: flex; align-items: center; gap: 8px; margin: 2px 0 10px; }
.daynav .mid { flex: 1; text-align: center; line-height: 1.25; }
.daynav strong { font-size: 16px; }
.arrow { border: 0; background: none; color: var(--text); width: 36px; height: 36px; font-size: 22px; border-radius: 12px; }
.arrow:disabled { opacity: .2; }
.progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; position: relative; }
.progress div { position: absolute; left: 0; top: 0; height: 100%; background: var(--accent); width: 0; border-radius: 3px; transition: width .3s; }
.progress .plan { background: color-mix(in srgb, var(--accent) 28%, var(--line)); }

/* Idag */
.hero { display: flex; align-items: center; gap: 16px; padding: 16px 16px 10px; }
.ring { position: relative; width: 78px; height: 78px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 8; }
.ring .track { stroke: var(--line); }
.ring .fill { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .5s ease; }
.ring .lbl { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; font-size: 17px; }
.ring .lbl small { display: block; font-size: 11px; font-weight: 500; color: var(--muted); text-align: center; margin-top: -3px; }
.hero h2 { margin: 0 0 2px; font-size: 21px; }
.hero .sub { color: var(--muted); font-size: 14px; }
.hero .datebar { display: flex; align-items: center; gap: 2px; margin: 4px 0 0 -8px; }
.hero .datebar .arrow { width: 30px; height: 30px; font-size: 18px; }
.hero .datebar span { font-size: 14px; color: var(--muted); }
.week { display: flex; justify-content: space-between; padding: 4px 16px 14px; }
.week button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 4px; font: inherit; font-size: 11px; color: var(--muted); padding: 2px 4px; border-radius: 10px; }
.week button.sel { color: var(--text); font-weight: 700; }
.week i { width: 20px; height: 20px; border-radius: 50%; background: var(--line); display: block; }
.week i.p1 { background: color-mix(in srgb, var(--accent) 35%, var(--line)); }
.week i.p2 { background: color-mix(in srgb, var(--accent) 65%, var(--line)); }
.week i.p3 { background: var(--accent); }
.week i.future { background: none; border: 1.5px dashed var(--line); }
.week button.sel i { outline: 2px solid var(--text); outline-offset: 2px; }
.slot { --c: var(--accent); border-top: 1px solid var(--line); }
.slot:first-child { border-top: 0; }
.slot-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 0 6px; cursor: pointer; }
.slot-head .t { font-weight: 700; display: inline-flex; align-items: center; gap: 8px; }
.slot-head .t::before { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.slot-head .clock { color: var(--muted); font-size: 13px; margin-left: 6px; font-weight: 400; }
.slot.collapsed .slot-head { padding-bottom: 12px; }
.slot.collapsed.finished .t { color: var(--muted); }
.slot .right { display: flex; align-items: center; gap: 2px; white-space: nowrap; }
.slot .chev { color: var(--muted); margin-left: 6px; }
.link { border: 0; background: none; color: var(--accent); font: inherit; font-size: 14px; font-weight: 600; padding: 4px 0 4px 12px; }
.link.grey { color: var(--muted); font-weight: 500; }
.item { display: flex; align-items: center; gap: 14px; padding: 9px 0; cursor: pointer; user-select: none; -webkit-user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
.check { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--c) 45%, var(--line));
  display: grid; place-items: center; color: transparent; font-size: 15px; font-weight: 700; transition: background .2s, border-color .2s; }
.item.done .check { background: var(--c); border-color: var(--c); color: #fff; }
.item.part .check { background: linear-gradient(90deg, var(--c) 50%, transparent 50%); border-color: var(--c); }
.item.done .name { color: var(--muted); }
.item.skip .check { border-style: dashed; color: var(--muted); }
.item.skip .name { color: var(--muted); }
.item .name { font-weight: 600; }
.item .sub { font-size: 13px; color: var(--muted); }
.item.just .check { animation: pop .38s ease-out; }
@keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.18); } 100% { transform: scale(1); } }
.ask { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 0; }
.ask .t { font-weight: 700; display: inline-flex; align-items: center; gap: 8px; color: var(--muted); }
.ask .t::before { content: ''; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--c); }
.banner { background: var(--warn-soft); color: var(--warn); border-radius: 14px; padding: 10px 14px; margin-bottom: 12px; font-size: 14px; }
.banner a { color: inherit; font-weight: 600; }
.moods { display: flex; justify-content: space-between; margin: 0 0 10px; }
.moods button { font-size: 26px; border: 0; background: none; padding: 4px 8px; border-radius: 14px; filter: grayscale(1); opacity: .45; transition: all .15s; }
.moods button.on { filter: none; opacity: 1; background: var(--accent-soft); transform: scale(1.08); }

/* Gemensamt */
.btn { border: 0; border-radius: 12px; padding: 11px 16px; font: inherit; font-weight: 600; background: var(--accent); color: #fff; }
.btn.secondary { background: var(--accent-soft); color: var(--accent); }
.btn.ghost { background: none; border: 1px solid var(--line); color: var(--text); }
.btn.danger { background: none; border: 1px solid var(--line); color: var(--danger); }
.btn.sm { padding: 7px 12px; font-size: 14px; }
.btn.block { display: block; width: 100%; margin-top: 8px; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
label { display: block; font-size: 14px; font-weight: 600; margin: 12px 0 4px; }
input[type=text], input[type=password], input[type=time], input[type=url], textarea, select {
  width: 100%; font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--bg); color: var(--text); min-width: 0; }
textarea { min-height: 70px; resize: vertical; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; font-size: 14px; }
.chips button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.seg { display: flex; background: var(--line); border-radius: 12px; padding: 3px; margin-bottom: 12px; }
.seg button { flex: 1; border: 0; background: none; padding: 8px; border-radius: 10px; font: inherit; font-size: 14px; color: var(--muted); }
.seg button.on { background: var(--card); color: var(--text); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.days { display: flex; gap: 4px; }
.days button { flex: 1; min-width: 0; padding: 8px 0; border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg); color: var(--muted); font: inherit; font-size: 14px; }
.days button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.nrow { display: grid; grid-template-columns: 1fr 76px 70px 36px; gap: 6px; margin-bottom: 6px; }
.nrow input, .nrow select { padding: 8px; }
.x { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 10px; min-width: 36px; height: 40px; font-size: 15px; }
.x:disabled { opacity: .3; }
.mrow { display: grid; grid-template-columns: 1fr 100px 36px 36px 36px; gap: 6px; margin-bottom: 4px; align-items: center; }
.mopt { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); margin: 0 0 10px 2px; font-weight: 400; }
.supp { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 11px 0; border-top: 1px solid var(--line); cursor: pointer; }
.supp:first-of-type { border-top: 0; }
.supp.paused .name { color: var(--muted); }
.supp .info { min-width: 0; }
.supp .low { color: var(--warn); font-weight: 600; }
.qty { display: inline-flex; align-items: center; gap: 4px; vertical-align: middle; margin-left: 4px; }
.qty button { width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; font-size: 15px; line-height: 1; padding: 0; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.pill { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--line); color: var(--muted); margin-left: 6px; font-weight: 600; text-transform: none; letter-spacing: 0; }
.shop .store { display: flex; justify-content: space-between; align-items: center; padding: 10px 0 2px; font-weight: 700; }
.shop .line { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0 3px 2px; font-size: 14px; }
.shop .group { border-top: 1px solid var(--line); padding-bottom: 8px; }
.shop .group:first-of-type { border-top: 0; }
a { color: var(--accent); }
details > summary { cursor: pointer; font-weight: 600; padding: 13px 0; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
details > summary::after { content: '›'; float: right; color: var(--muted); transition: transform .2s; }
details[open] > summary::after { transform: rotate(90deg); }
details[open] { padding-bottom: 12px; }
.hist { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; padding: 12px 0; }
.hist div { position: relative; aspect-ratio: 1; border-radius: 10px; display: grid; place-items: center; font-size: 12px; background: var(--line); color: var(--muted); cursor: pointer; }
.hist .wd { aspect-ratio: auto; background: none; font-weight: 600; cursor: default; }
.hist .empty { background: none; cursor: default; }
.hist .p1 { background: color-mix(in srgb, var(--accent) 35%, var(--line)); color: var(--text); }
.hist .p2 { background: color-mix(in srgb, var(--accent) 65%, var(--line)); color: #fff; }
.hist .p3 { background: var(--accent); color: #fff; }
.hist .today { outline: 2px solid var(--text); outline-offset: -2px; }
.hist .mood { position: absolute; bottom: 3px; right: 3px; width: 7px; height: 7px; border-radius: 50%; border: 1px solid var(--card); }
.stat { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.stat:first-child { border-top: 0; }
.nut { padding: 10px 0; border-top: 1px solid var(--line); cursor: pointer; }
.nut:first-of-type { border-top: 0; }
.nut .top { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.nut .pct { font-weight: 700; font-variant-numeric: tabular-nums; }
.nut .detail { font-size: 13px; color: var(--muted); margin-top: 6px; display: none; }
.nut.open .detail { display: block; }
.nut.plain .top { margin-bottom: 0; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 6px; border-radius: 3px; margin-right: 5px; vertical-align: middle; background: var(--accent); }
.legend i.plan { background: color-mix(in srgb, var(--accent) 28%, var(--line)); }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 10px 0; font-weight: 600; font-size: 15px; }
.toggle input { width: 22px; height: 22px; }
.empty-state { text-align: center; padding: 28px 10px; color: var(--muted); }
.preview { font-size: 14px; max-height: 340px; overflow: auto; border: 1px solid var(--line); border-radius: 12px; padding: 4px 10px; margin-top: 10px; }
.preview div { padding: 6px 0; border-top: 1px solid var(--line); }
.preview div:first-child { border-top: 0; }
.sheet-bg { position: fixed; inset: 0; z-index: 30; background: rgba(20, 25, 22, .38); display: flex; align-items: flex-end; justify-content: center; animation: fade .15s; }
.sheet { background: var(--card); width: 100%; max-width: 640px; border-radius: 22px 22px 0 0; padding: 18px 16px calc(16px + env(safe-area-inset-bottom)); animation: up .2s ease-out; }
.sheet h2 { margin: 0 0 2px; }
.stepper { display: flex; align-items: center; justify-content: center; gap: 18px; margin: 10px 0 2px; font-size: 18px; font-weight: 700; }
.stepper button { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); color: var(--text); font-size: 20px; }
@keyframes fade { from { opacity: 0; } }
@keyframes up { from { transform: translateY(40px); opacity: .5; } }
#toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(8px);
  background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 14px; opacity: 0; pointer-events: none;
  transition: opacity .2s, transform .2s; z-index: 40; max-width: 92vw; display: flex; align-items: center; gap: 14px; white-space: nowrap; }
#toast.show { opacity: 1; pointer-events: auto; transform: translateX(-50%); }
#toast button { border: 0; background: none; color: inherit; font: inherit; font-weight: 700; text-decoration: underline; padding: 0; }
.hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>Dosa</h1>
  <button id="syncState" title="Synka nu">Lokalt</button>
</header>
<main>
  <section id="view-today"></section>
  <section id="view-overview" class="hidden"></section>
  <section id="view-list" class="hidden"></section>
  <section id="view-settings" class="hidden"></section>
  <section id="view-edit" class="hidden"></section>
</main>
<nav>
  <button data-view="today" class="on"><span>✓</span>Idag</button>
  <button data-view="overview"><span>📊</span>Översikt</button>
  <button data-view="list"><span>💊</span>Tillskott</button>
  <button data-view="settings"><span>⚙︎</span>Inställningar</button>
</nav>
<div id="toast"></div>
<datalist id="nutrient-names"></datalist>

<script>
'use strict';

// ---------- Lagring ----------
const STORE_KEY = 'tillskott.data.v1';
const SYNC_KEY = 'tillskott.sync.v1';
const NOTIFIED_KEY = 'tillskott.notified';
const GIST_FILE = 'tillskott.json';
// Nycklar och gist-beskrivning behåller det gamla namnet så att befintlig data och synk hittas
const GIST_DESC = 'Tillskott – appdata (skapad av Tillskott-appen)';
const WEEKDAYS = ['Mån', 'Tis', 'Ons', 'Tor', 'Fre', 'Lör', 'Sön'];
const LOW_DAYS = 14; // varna när ett tillskott räcker färre dagar än så här

function lsGet(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; }
}
function lsSet(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
}

// supplements: { id: {id, name, dose, perDose, packSize, price, stockBase, stockAt, brand, url, contents,
//                     nutrients[{k,name,amount,unit}], times[momentnamn], days[0..6], note, active, deleted, createdAt, updatedAt} }
// moments: [{name, time, optional}] i visningsordning, momentsAt = senast ändrad. optional = visas bara de dagar man slår på den (t.ex. PWO)
// log: { 'YYYY-MM-DD': { 'id@moment': {v: bool, q?: tagen mängd om bara en del, s?: true ("inte idag"), t: ms}, '@moment': {v: bool, t} (valfri tidpunkt påslagen) } }
// notes: { 'YYYY-MM-DD': {text, mood: 1–5, t} }
let data = lsGet(STORE_KEY, null) || { supplements: {}, log: {} };
let sync = lsGet(SYNC_KEY, { token: '', gistId: '', lastSync: 0 });

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const dateKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const weekdayIdx = d => (d.getDay() + 6) % 7; // 0 = måndag
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => parseFloat(String(v ?? '').replace(/\s/g, '').replace(',', '.'));
const fmt = (n, d = 1) => n.toLocaleString('sv-SE', { maximumFractionDigits: n < 10 ? Math.max(d, 2) : n < 100 ? d : 0 });
const kr = n => Math.round(n).toLocaleString('sv-SE') + ' kr';

function save(changed = true) {
  lsSet(STORE_KEY, data);
  if (changed) scheduleSync();
}

function normalize() {
  data.supplements = data.supplements || {};
  data.log = data.log || {};
  data.notes = data.notes || {};
  data.settings = data.settings || { notify: false };
  data.moments = data.moments || [];
  data.momentsAt = data.momentsAt || 0;
  // Äldre data hade klockslag direkt på tillskotten – gör om dem till tidpunkter
  for (const s of Object.values(data.supplements)) {
    if (s.deleted) continue;
    for (const t of s.times || []) if (!data.moments.some(m => m.name === t)) {
      data.moments.push({ name: t, time: /^\d\d:\d\d$/.test(t) ? t : '' }); data.momentsAt = data.momentsAt || 1;
    }
    if (s.perDose == null) s.perDose = num(s.dose) || null;
  }
}

// ---------- Förvald lista ----------
// Den lista du skickade. Fasta id:n och updatedAt = 1 gör att en enhet som synkar aldrig skriver över ändringar som gjorts på en annan.
const SEED_MOMENTS = [{ name: 'Frukost', time: '' }, { name: 'PWO', time: '', optional: true }, { name: 'Kvällsrutin', time: '' }];
const MULTI = `Vit C (askorbinsyra) 80 mg
Vit B3 16 mg
Vit E 12 mg
Vit B5 6 mg
Vit B2 1,4 mg
Vit B6 1,4 mg
Vit B1 1,1 mg
Vit A 800 µg
Folsyra 200 µg
D-biotin 50 µg
Vit B12 5 µg
Vit D 5 µg
Järn (fumarat) 14 mg
Zink (glukonat) 10 mg
Mangan (glukonat) 2 mg
Koppar (klorid) 1 mg
Jod (kalium) 150 µg
Selen (natrium) 60 µg
Krom (klorid) 40 µg`;

// ---------- Schema ----------
function moment(name) { return data.moments.find(m => m.name === name); }
function momentIdx(name) { const i = data.moments.findIndex(m => m.name === name); return i < 0 ? 999 : i; }
function momentTime(name) { return moment(name)?.time || (/^\d\d:\d\d$/.test(name) ? name : ''); }
function optionalOn(dk, name) { return !!data.log[dk]?.['@' + name]?.v; }

function activeSupps() {
  return Object.values(data.supplements).filter(s => !s.deleted)
    .sort((a, b) => momentIdx(a.times?.[0]) - momentIdx(b.times?.[0]) || (a.order ?? 999) - (b.order ?? 999) || a.name.localeCompare(b.name, 'sv'));
}
// includeOff: ta med valfria tidpunkter som inte är påslagna (för att kunna visa dem)
function scheduledFor(date, includeOff = false) {
  const wd = weekdayIdx(date), dk = dateKey(date);
  const out = [];
  for (const s of activeSupps()) {
    if (!s.active) continue;
    if (s.days && s.days.length && !s.days.includes(wd)) continue;
    if (s.createdAt && dk < dateKey(new Date(s.createdAt))) continue; // fanns inte än
    for (const t of (s.times && s.times.length ? s.times : ['—'])) {
      const off = moment(t)?.optional && !optionalOn(dk, t);
      if (off && !includeOff) continue;
      out.push({ s, time: t, key: `${s.id}@${t}`, off });
    }
  }
  return out;
}
const entry = (dk, key) => data.log[dk]?.[key];
function isTaken(dk, key) { return !!entry(dk, key)?.v; }
function isSkipped(dk, key) { const e = entry(dk, key); return !!(e && !e.v && e.s); }
// q = tagen mängd när bara en del av dosen togs
function setLog(dk, key, v, skip = false, q = null) {
  data.log[dk] = data.log[dk] || {};
  data.log[dk][key] = skip ? { v: false, s: true, t: Date.now() } : { v, t: Date.now(), ...(v && q != null ? { q } : {}) };
  save();
}
function dayStats(date) {
  const dk = dateKey(date);
  const items = scheduledFor(date).filter(i => !isSkipped(dk, i.key));
  return { total: items.length, done: items.filter(i => isTaken(dk, i.key)).length };
}

// ---------- Lager och kostnad ----------
function unitWord(s) {
  const w = (String(s.dose || '').match(/^[\d.,\s]+([\p{L}]+)/u) || [])[1] || '';
  return /^kaps/i.test(w) ? 'kapslar' : /^tabl/i.test(w) ? 'tabletter' : /^gram$/i.test(w) ? 'g' : w.toLowerCase();
}
// Genomsnittlig åtgång per dag enligt schemat. Valfria tidpunkter (PWO) räknas som 3 dagar i veckan.
function dailyUse(s) {
  if (!s.active || !(s.perDose > 0)) return 0;
  const days = (s.days && s.days.length ? s.days.length : 7) / 7;
  return (s.times || []).reduce((sum, t) => sum + (moment(t)?.optional ? 3 / 7 : 1), 0) * days * s.perDose;
}
function stockLeft(s) {
  if (s.stockBase == null || !(s.perDose > 0)) return null;
  const since = dateKey(new Date(s.stockAt || 0));
  let used = 0;
  for (const [dk, entries] of Object.entries(data.log)) {
    if (dk < since) continue;
    for (const [k, e] of Object.entries(entries)) if (e.v && e.t > (s.stockAt || 0) && k.startsWith(s.id + '@')) used += e.q ?? s.perDose;
  }
  return Math.max(0, s.stockBase - used);
}
function daysLeft(s) {
  const left = stockLeft(s), use = dailyUse(s);
  return left == null || !use ? null : Math.floor(left / use);
}
function monthlyCost(s) {
  return s.price > 0 && s.packSize > 0 ? s.price / s.packSize * dailyUse(s) * 30 : 0;
}
function refill(s) {
  const left = stockLeft(s) ?? 0;
  data.supplements[s.id] = { ...s, stockBase: left + (s.packSize || 0), stockAt: Date.now(), updatedAt: Date.now() };
  save();
}

}

const NUT = Object.fromEntries(NUTRIENTS.map(n => [n.k, n]));
for (const n of NUTRIENTS) n.rx = new RegExp(`(?<![\\p{L}\\p{N}])(?:${n.re})(?![\\p{L}\\p{N}])`, 'giu');
document.getElementById('nutrient-names').innerHTML = NUTRIENTS.map(n => `<option value="${esc(n.name)}">`).join('');

const UNITS = ['mg', 'µg', 'g', 'ml', 'IU'];
const AMOUNT_RX = /(\d+(?:[.,]\d+)?)\s*(mg|µg|μg|ug|mcg|gram|g|ml|iu|ie)(?![\p{L}])/giu;
function normUnit(u) {
  u = u.toLowerCase();
  return { 'μg': 'µg', ug: 'µg', mcg: 'µg', gram: 'g', iu: 'IU', ie: 'IU' }[u] || u;
}
function amountsIn(text) {
  return [...text.matchAll(AMOUNT_RX)].map(m => ({ amount: num(m[1]), unit: normUnit(m[2]), i: m.index, end: m.index + m[0].length }));
}
const isMass = a => ['mg', 'µg', 'g'].includes(a.unit);
function preferred(list) { return list.find(isMass) || list[0]; }

// Hittar kända ämnen i en text. Ämnen inom parentes utan siffror, t.ex. "Jod (kalium)", räknas inte.
function findNutrients(text) {
  const masked = text.replace(/\([^()]*\)/g, m => /\d/.test(m) ? m : ' '.repeat(m.length));
  const hits = [];
  for (const n of NUTRIENTS) for (const m of masked.matchAll(n.rx)) hits.push({ k: n.k, i: m.index, end: m.index + m[0].length });
  hits.sort((a, b) => a.i - b.i || (b.end - b.i) - (a.end - a.i));
  return hits.filter((h, idx) => !hits.slice(0, idx).some(o => h.i < o.end && o.i < h.end));
}

// Tolkar "innehåll per dos" till en lista med ämnen och mängder
function parseContents(text, supName = '', qtyText = '') {
  text = String(text || '').replace(/\r/g, '');
  const found = {};
  const add = (k, name, a) => {
    const key = k + '|' + a.unit;
    found[key] = found[key] || { k, name, amount: 0, unit: a.unit };
    found[key].amount += a.amount;
  };
  for (const seg of text.split(/\n|;|,(?!\d)/)) {
    const hits = findNutrients(seg);
    if (!hits.length) continue;
    const amounts = amountsIn(seg);
    const amountFirst = amounts.length && /^\s*$/.test(seg.slice(0, amounts[0].i));
    const used = new Set();
    hits.forEach((h, idx) => {
      let pick;
      if (amountFirst) {
        const from = idx ? hits[idx - 1].end : 0;
        pick = amounts.filter(a => a.i >= from && a.end <= h.i && !used.has(a)).pop();
      } else {
        const to = idx + 1 < hits.length ? hits[idx + 1].i : seg.length;
        pick = preferred(amounts.filter(a => a.i >= h.end && a.end <= to && !used.has(a)));
      }
      if (!pick) return;
      used.add(pick);
      add(h.k, NUT[h.k].name, pick);
    });
  }
  let out = Object.values(found);
  if (!out.length) {
    // Inget känt ämne i texten: använd tillskottets namn och första mängden
    let a = preferred(amountsIn(text)) || preferred(amountsIn(qtyText));
    if (a) {
      a = { ...a };
      const qty = num(qtyText);
      if (/(?<![\p{L}])(styck|st|per kapsel|per tablett|\/st)(?![\p{L}])/iu.test(text) && qty > 0) a.amount *= qty;
      const hit = findNutrients(supName)[0];
      out = [hit ? { k: hit.k, name: NUT[hit.k].name, amount: a.amount, unit: a.unit }
                 : { k: 'x:' + supName.trim().toLowerCase(), name: supName.trim(), amount: a.amount, unit: a.unit }];
    }
  }
  return out.map(n => ({ ...n, amount: Math.round(n.amount * 1000) / 1000 }));
}

function nutrientKeyFor(name) {
  const t = name.trim();
  const exact = NUTRIENTS.find(n => n.name.toLowerCase() === t.toLowerCase());
  if (exact) return exact.k;
  const hits = findNutrients(t);
  if (hits.length === 1 && hits[0].i === 0 && hits[0].end >= t.length - 1) return hits[0].k;
  return 'x:' + t.toLowerCase();
}

// Räknar om till ämnets egen enhet; null om det inte går (t.ex. ml av ett vitamin)
function toRefUnit(n, amount, unit) {
  if (unit === n.unit) return amount;
  if (unit === 'IU') return n.iu ? amount * n.iu * (n.unit === 'mg' ? 0.001 : 1) : null;
  const mg = { g: 1000, mg: 1, 'µg': 0.001 }[unit];
  if (mg == null) return null;
  return amount * mg / (n.unit === 'mg' ? 1 : 0.001);
}

function nutrientTotals(date) {
  const dk = dateKey(date);
  const totals = {};
  for (const i of scheduledFor(date)) {
    if (isSkipped(dk, i.key)) continue;
    const taken = isTaken(dk, i.key);
    const q = entry(dk, i.key)?.q;
    const share = taken && q != null && i.s.perDose > 0 ? q / i.s.perDose : 1;
    for (const n of i.s.nutrients || []) {
      const ref = NUT[n.k];
      let amount = n.amount, unit = n.unit, key = n.k + (ref ? '' : '|' + n.unit);
      if (ref) { amount = toRefUnit(ref, n.amount, n.unit); unit = ref.unit; if (amount == null) continue; }
      const t = totals[key] = totals[key] || { k: n.k, name: ref ? ref.name : n.name, unit, ri: ref?.ri, g: ref ? ref.g : 'x', plan: 0, taken: 0, src: [] };
      t.plan += amount;
      if (taken) t.taken += amount * share;
      if (!t.src.includes(i.s.name)) t.src.push(i.s.name);
    }
  }
  return totals;
}

function dayLabel(date) {
  const dk = dateKey(date);
  const y = new Date(); y.setDate(y.getDate() - 1);
  const short = date.toLocaleDateString('sv-SE', { weekday: 'short', day: 'numeric', month: 'short' });
  if (dk === dateKey(new Date())) return 'Idag · ' + short;
  if (dk === dateKey(y)) return 'Igår · ' + short;
  return date.toLocaleDateString('sv-SE', { weekday: 'long', day: 'numeric', month: 'long' });
}
function dayNav(onChange, subtitle = '') {
  const isToday = dateKey(viewDate) === dateKey(new Date());
  const html = `<div class="daynav">
    <button class="arrow" data-act="prev" aria-label="Föregående dag">‹</button>
    <div class="mid"><strong>${esc(dayLabel(viewDate))}</strong>${subtitle ? `<div class="muted small">${subtitle}</div>` : ''}</div>
    <button class="arrow" data-act="next" aria-label="Nästa dag" ${isToday ? 'disabled' : ''}>›</button>
  </div>`;
  const bind = el => {
    el.querySelector('[data-act=prev]').onclick = () => { viewDate.setDate(viewDate.getDate() - 1); onChange(); };
    el.querySelector('[data-act=next]').onclick = () => {
      if (dateKey(viewDate) === dateKey(new Date())) return;
      viewDate.setDate(viewDate.getDate() + 1); onChange();
    };
  };
  return { html, bind };
}

  return h < 5 ? 'God natt 🌙' : h < 10 ? 'God morgon ☀️' : h < 12 ? 'God förmiddag' : h < 17 ? 'God eftermiddag' : h < 22 ? 'God kväll 🌙' : 'God natt 🌙';
}
// Vilken tidpunkt som är "nu": klockslag om sådana finns, annars tid på dygnet, annars den första som inte är klar
function currentSlot(open) {
  if (!open.length) return null;
  const now = new Date(), mins = now.getHours() * 60 + now.getMinutes();
  const timed = open.filter(t => momentTime(t) && minutesOf(momentTime(t)) <= mins + 60).sort((a, b) => minutesOf(momentTime(b)) - minutesOf(momentTime(a)));
  if (timed.length) return timed[0];
  const h = now.getHours();
  if (h >= 17) { const ev = open.find(t => /kväll|natt|sömn/i.test(t)); if (ev) return ev; }
  return open[0];
}

// Ångra: skriver tillbaka hur dagens logg såg ut före ändringen (med ny tidsstämpel så att synken tar den)
function withUndo(dk, label, fn) {
  const before = JSON.parse(JSON.stringify(data.log[dk] || {}));
  fn();
  toast(label, 'Ångra', () => {
    const after = data.log[dk] = data.log[dk] || {};
    const now = Date.now();
    for (const k of Object.keys(after)) {
      if (JSON.stringify(after[k]) === JSON.stringify(before[k])) continue;
      after[k] = before[k] ? { ...before[k], t: now } : { v: false, t: now };
    }
    save(); render();
  });
}

  const dk = dateKey(viewDate);
  const isToday = dk === dateKey(new Date());
  const all = scheduledFor(viewDate, true);
  const { total, done } = dayStats(viewDate);

  const slots = {};
  for (const i of all) (slots[i.time] = slots[i.time] || []).push(i);
  const order = Object.keys(slots).sort((a, b) => momentIdx(a) - momentIdx(b) || a.localeCompare(b));
  const openOf = t => slots[t].filter(i => !isTaken(dk, i.key) && !isSkipped(dk, i.key));
  const unfinished = order.filter(t => !slots[t][0].off && openOf(t).length);
  const now = isToday ? currentSlot(unfinished) : unfinished[0];

  // Överst: ring, hälsning, datum och veckan
  const C = 2 * Math.PI * 33, frac = total ? done / total : 0;
  let sub;
  if (!total) sub = all.length ? 'Inget kvar att ta' : 'Inget schemalagt';
  else if (done === total) sub = isToday ? 'Allt klart för idag 🌿' : 'Allt togs den här dagen 🌿';
  else sub = `${total - done} kvar${now ? ` · nu: ${esc(now)}` : ''}`;
  const monday = new Date(viewDate); monday.setDate(monday.getDate() - weekdayIdx(monday));
  let week = '';
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday); d.setDate(d.getDate() + i);
    const future = dateKey(d) > dateKey(new Date());
    const st = future ? null : dayStats(d);
    const p = !st || !st.total ? '' : st.done >= st.total ? 'p3' : st.done / st.total >= .5 ? 'p2' : st.done ? 'p1' : '';
    week += `<button data-wd="${dateKey(d)}" class="${dateKey(d) === dk ? 'sel' : ''}" ${future ? 'disabled' : ''}><i class="${future ? 'future' : p}"></i>${WEEKDAYS[i][0]}</button>`;
  }
  let html = `<div class="card" style="padding:0">
    <div class="hero">
      <div class="ring"><svg viewBox="0 0 78 78"><circle class="track" cx="39" cy="39" r="33"/>
        <circle class="fill" cx="39" cy="39" r="33" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - frac)}" ${frac ? '' : 'style="opacity:0"'}/></svg>
        <div class="lbl"><div>${done}<small>av ${total}</small></div></div></div>
      <div style="min-width:0"><h2>${isToday ? greeting() : 'Så här såg dagen ut'}</h2><div class="sub">${sub}</div>
        <div class="datebar"><button class="arrow" data-act="prev" aria-label="Föregående dag">‹</button><span>${esc(dayLabel(viewDate))}</span>
        <button class="arrow" data-act="next" aria-label="Nästa dag" ${isToday ? 'disabled' : ''}>›</button></div></div>
    </div>
    <div class="week">${week}</div></div>`;

  if (!activeSupps().length) {
    html += `<div class="card pad empty-state">Du har inga tillskott inlagda än.<div class="btns" style="justify-content:center">
      <button class="btn" data-act="add">Lägg till tillskott</button></div></div>`;
  } else if (all.length) {
    if (isToday) {
      const due = dueUntaken();
      if (due.length) html += `<div class="banner">Dags nu: ${due.map(i => esc(i.s.name)).join(', ')}</div>`;
      const low = lowStock();
      if (low.length) html += `<div class="banner">Snart slut: ${low.map(x => `${x.s.url ? `<a href="${esc(x.s.url)}" target="_blank" rel="noopener">${esc(x.s.name)}</a>` : esc(x.s.name)} (${x.d} d)`).join(', ')}</div>`;
    }
    html += `<div class="card">`;
    for (const t of order) {
      const list = slots[t];
      const clock = momentTime(t);
      const name = `${t === '—' ? 'Ingen tidpunkt' : esc(t)}${clock && clock !== t ? `<span class="clock">${esc(clock)}</span>` : ''}`;
      if (list[0].off) {
        html += `<div class="slot" style="--c:${momentColor(t)}"><div class="ask"><span class="t">${name}</span><span class="right">
          <span class="muted small">inte idag</span><button class="link" data-on="${esc(t)}">Slå på</button></span></div></div>`;
        continue;
      }
      const open = openOf(t);
      const taken = list.filter(i => isTaken(dk, i.key)).length;
      const counted = list.filter(i => !isSkipped(dk, i.key)).length;
      const finished = !open.length;
      const expandedNow = slotOverride[dk + t] ?? (!finished && t === now);
      const optional = moment(t)?.optional;
      html += `<div class="slot ${expandedNow ? '' : 'collapsed'} ${finished ? 'finished' : ''}" data-slot="${esc(t)}" style="--c:${momentColor(t)}">
        <div class="slot-head"><span class="t">${name}</span><span class="right">`;
      if (!expandedNow) html += `<span class="muted small">${finished ? `✓ ${taken}/${counted}` : `${open.length} kvar`}</span><span class="chev">›</span>`;
      else if (finished) html += `<span class="muted small">✓ ${taken}/${counted}</span>`;
      else html += `<button class="link grey" data-${optional && !taken ? 'off' : 'skipall'}="${esc(t)}">Inte idag</button><button class="link" data-all="${esc(t)}">Alla ✓</button>`;
      html += `</span></div>`;
      if (expandedNow) for (const i of list) {
        const e = entry(dk, i.key);
        const tk = !!e?.v, skip = isSkipped(dk, i.key), part = tk && e.q != null && e.q < i.s.perDose;
        const sub = skip ? 'Inte idag' : part ? `${fmt(e.q)} av ${fmt(i.s.perDose)} ${unitWord(i.s)}` : [i.s.dose, i.s.note].filter(Boolean).join(' · ');
        html += `<div class="item ${tk ? (part ? 'part' : 'done') : ''} ${skip ? 'skip' : ''} ${justTicked === dk + i.key ? 'just' : ''}" data-key="${esc(i.key)}">
          <div class="check">${skip ? '–' : '✓'}</div>
          <div><div class="name">${esc(i.s.name)}</div><div class="sub">${esc(sub)}</div></div></div>`;
      }
      html += `</div>`;
    }
    html += `</div><p class="muted small" style="text-align:center;margin:-6px 0 14px">Tryck för att bocka av · håll inne för fler val</p>`;
  }
  const note = data.notes?.[dk] || {};
  html += `<div class="card pad"><div class="row between" style="margin-bottom:8px"><b>Hur mår du${isToday ? ' idag' : ''}?</b></div>
    <div class="moods">${MOODS.map((m, n) => `<button data-mood="${n + 1}" class="${note.mood === n + 1 ? 'on' : ''}" aria-label="Mående ${n + 1} av 5">${m}</button>`).join('')}</div>
    <textarea id="t-note" placeholder="Sömn, energi, träning …" style="min-height:52px">${esc(note.text || '')}</textarea></div>`;
  el.innerHTML = html;
  justTicked = null;

  const go = d => { viewDate = d; renderToday(); };
  el.querySelector('[data-act=prev]').onclick = () => { const d = new Date(viewDate); d.setDate(d.getDate() - 1); go(d); };
  el.querySelector('[data-act=next]').onclick = () => { if (!isToday) { const d = new Date(viewDate); d.setDate(d.getDate() + 1); go(d); } };
  el.querySelectorAll('[data-wd]').forEach(b => b.onclick = () => go(parseKey(b.dataset.wd)));
  el.querySelector('[data-act=add]')?.addEventListener('click', () => openEdit(null));

  const finishedToast = t => {
    if (scheduledFor(viewDate).filter(i => i.time === t).every(i => isTaken(dk, i.key) || isSkipped(dk, i.key))) {
      const st = dayStats(viewDate);
      toast(st.total && st.done >= st.total ? 'Allt klart för idag 🌿' : `${t} klar 🌿`);
    }
  };
  el.querySelectorAll('.item').forEach(it => {
    let timer = null, long = false;
    const cancel = () => clearTimeout(timer);
    it.addEventListener('pointerdown', () => {
      long = false;
      timer = setTimeout(() => { long = true; navigator.vibrate?.(12); openItemSheet(dk, it.dataset.key); }, 500);
    });
    it.addEventListener('pointerup', cancel); it.addEventListener('pointerleave', cancel); it.addEventListener('pointercancel', cancel);
    it.addEventListener('contextmenu', e => e.preventDefault());
    it.addEventListener('click', () => {
      if (long) return;
      const k = it.dataset.key, was = isTaken(dk, k);
      setLog(dk, k, !was);
      if (!was) justTicked = dk + k;
      renderToday();
      if (!was) finishedToast(k.slice(k.indexOf('@') + 1));
    });
  });
  el.querySelectorAll('.slot-head').forEach(h => h.addEventListener('click', e => {
    if (e.target.closest('button')) return;
    const s = h.parentElement, key = dk + s.dataset.slot;
    slotOverride[key] = s.classList.contains('collapsed');
    renderToday();
  }));
  el.querySelectorAll('[data-all]').forEach(b => b.addEventListener('click', () => {
    const t = b.dataset.all;
    withUndo(dk, `${t}: allt avbockat`, () => {
      for (const i of scheduledFor(viewDate)) if (i.time === t && !isTaken(dk, i.key) && !isSkipped(dk, i.key)) setLog(dk, i.key, true);
    });
    renderToday();
  }));
  el.querySelectorAll('[data-skipall]').forEach(b => b.addEventListener('click', () => {
    const t = b.dataset.skipall;
    withUndo(dk, `${t}: inte idag`, () => {
      for (const i of scheduledFor(viewDate)) if (i.time === t && !isTaken(dk, i.key)) setLog(dk, i.key, false, true);
    });
    renderToday();
  }));
  el.querySelectorAll('[data-on]').forEach(b => b.addEventListener('click', () => {
    setLog(dk, '@' + b.dataset.on, true); slotOverride[dk + b.dataset.on] = true; renderToday();
  }));
  el.querySelectorAll('[data-off]').forEach(b => b.addEventListener('click', () => {
    const t = b.dataset.off;
    withUndo(dk, `${t}: inte idag`, () => setLog(dk, '@' + t, false));
    delete slotOverride[dk + t]; renderToday();
  }));
  const saveNote = patch => { data.notes[dk] = { ...(data.notes[dk] || {}), ...patch, t: Date.now() }; save(); };
  el.querySelectorAll('[data-mood]').forEach(b => b.onclick = () => {
    const m = +b.dataset.mood;
    saveNote({ mood: data.notes[dk]?.mood === m ? null : m });
    el.querySelectorAll('[data-mood]').forEach(x => x.classList.toggle('on', +x.dataset.mood === data.notes[dk].mood));
  });
  let noteTimer;
  el.querySelector('#t-note').addEventListener('input', e => {
    clearTimeout(noteTimer);
    noteTimer = setTimeout(() => saveNote({ text: e.target.value }), 600);
  });
}

// Meny när man håller inne på ett tillskott: hela dosen, del av dosen, inte idag
function openItemSheet(dk, key) {
  const i = scheduledFor(parseKey(dk)).find(x => x.key === key);
  if (!i) return;
  const s = i.s, e = entry(dk, key);
  const per = s.perDose > 0 ? s.perDose : 1, unit = unitWord(s);
  let q = e?.v && e.q != null ? e.q : Math.max(1, Math.round(per / 2));
  const bg = document.createElement('div');
  bg.className = 'sheet-bg';
  const close = () => bg.remove();
  const draw = () => {
    bg.innerHTML = `<div class="sheet"><h2>${esc(s.name)}</h2><div class="muted">${esc([i.time, s.dose].filter(Boolean).join(' · '))}</div>
      <button class="btn block" data-a="full" style="margin-top:14px">Tagit hela dosen</button>
      ${per > 1 ? `<div class="card pad" style="margin:10px 0 0;box-shadow:none;border:1px solid var(--line)"><div class="muted small" style="text-align:center">Tagit bara en del</div>
        <div class="stepper"><button data-a="minus" aria-label="Mindre">−</button><span>${fmt(q)} av ${fmt(per)} ${esc(unit)}</span><button data-a="plus" aria-label="Mer">+</button></div>
        <button class="btn secondary block" data-a="part">Spara ${fmt(q)} ${esc(unit)}</button></div>` : ''}
      ${isSkipped(dk, key) ? '' : `<button class="btn ghost block" data-a="skip">Inte idag</button>`}
      ${e?.v || isSkipped(dk, key) ? `<button class="btn ghost block" data-a="clear">Inte tagit</button>` : ''}
      <button class="btn ghost block" data-a="close" style="border:0;color:var(--muted)">Avbryt</button></div>`;
  };
  draw();
  bg.addEventListener('click', ev => {
    if (ev.target === bg) return close();
    const a = ev.target.closest('[data-a]')?.dataset.a;
    if (!a) return;
    const step = per >= 2 ? 1 : 0.5;
    if (a === 'minus') { q = Math.max(step, q - step); return draw(); }
    if (a === 'plus') { q = Math.min(per - step, q + step); return draw(); }
    if (a === 'full') { setLog(dk, key, true); justTicked = dk + key; }
    if (a === 'part') { setLog(dk, key, true, false, q); justTicked = dk + key; }
    if (a === 'skip') withUndo(dk, `${s.name}: inte idag`, () => setLog(dk, key, false, true));
    if (a === 'clear') setLog(dk, key, false);
    close(); renderToday();
  });
  document.body.appendChild(bg);
}

// ---------- Översikt ----------
let overviewMode = 'day', showAllNutrients = false;
const openNut = new Set();
function renderOverview() {
  const el = document.getElementById('view-overview');
  el.innerHTML = `<div class="seg"><button data-mode="day" class="${overviewMode === 'day' ? 'on' : ''}">Näring per dag</button>
    <button data-mode="month" class="${overviewMode === 'month' ? 'on' : ''}">Månad</button></div><div id="ov-body"></div>`;
  el.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { overviewMode = b.dataset.mode; renderOverview(); });
  const body = el.querySelector('#ov-body');
  overviewMode === 'day' ? renderNutrients(body) : renderHistory(body);
}

function renderNutrients(el) {
  const nav = dayNav(renderOverview);
  const totals = nutrientTotals(viewDate);
  const refs = NUTRIENTS.filter(n => n.ri).map(n => totals[n.k] || { k: n.k, name: n.name, unit: n.unit, ri: n.ri, g: n.g, plan: 0, taken: 0, src: [] });
  const shown = showAllNutrients ? refs : refs.filter(t => t.plan > 0);
  const others = Object.values(totals).filter(t => !t.ri).sort((a, b) => a.name.localeCompare(b.name, 'sv'));
  const amount = t => `${fmt(t.taken)}${t.plan !== t.taken ? ` av ${fmt(t.plan)}` : ''} ${t.unit}`;
  const row = t => {
    const pct = t.taken / t.ri * 100, planPct = t.plan / t.ri * 100;
    return `<div class="nut ${openNut.has(t.k) ? 'open' : ''}" data-k="${esc(t.k)}">
      <div class="top"><span>${esc(t.name)}</span><span class="pct">${t.plan ? Math.round(pct) + ' %' : '–'}</span></div>
      <div class="progress"><div class="plan" style="width:${Math.min(100, planPct)}%"></div><div style="width:${Math.min(100, pct)}%"></div></div>
      <div class="detail">${t.plan ? `${amount(t)} · RI ${fmt(t.ri)} ${t.unit}<br>${t.src.map(esc).join(', ')}` : `RI ${fmt(t.ri)} ${t.unit} · inget från dina tillskott`}</div></div>`;
  };
  const group = (g, title) => {
    const list = shown.filter(t => t.g === g);
    return list.length ? `<h3>${title}</h3>${list.map(row).join('')}` : '';
  };
  el.innerHTML = nav.html + `
    <div class="card" style="padding-bottom:6px">
      ${shown.length ? group('v', 'Vitaminer') + group('m', 'Mineraler') : '<p class="muted">Inga tillskott med vitaminer eller mineraler den här dagen.</p>'}
      <button class="link" data-act="all" style="padding:10px 0">${showAllNutrients ? 'Visa bara det jag får i mig' : `Visa alla ${refs.length} ämnen`}</button>
    </div>
    ${others.length ? `<div class="card"><h3>Övrigt</h3>${others.map(t => `<div class="nut plain ${openNut.has(t.k + t.unit) ? 'open' : ''}" data-k="${esc(t.k + t.unit)}">
      <div class="top"><span>${esc(t.name)}</span><span class="muted">${amount(t)}</span></div>
      <div class="detail">${t.src.map(esc).join(', ')}</div></div>`).join('')}</div>` : ''}
    <div class="legend" style="margin:0 4px 8px"><span><i></i>Avbockat</span><span><i class="plan"></i>Planerat</span></div>
    <p class="muted small" style="margin:0 4px 12px">Procent av EU:s referensintag (RI), samma som "% DRI" på förpackningar. Räknas bara på dina tillskott, inte på maten.
      RI är ett genomsnittligt märkningsvärde – ingen personlig rekommendation och ingen övre gräns. Tryck på en rad för detaljer.</p>`;
  nav.bind(el);
  el.querySelector('[data-act=all]').onclick = () => { showAllNutrients = !showAllNutrients; renderOverview(); };
  el.querySelectorAll('.nut').forEach(r => r.onclick = () => {
    openNut.has(r.dataset.k) ? openNut.delete(r.dataset.k) : openNut.add(r.dataset.k);
    r.classList.toggle('open');
  });
}

let histMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
function renderHistory(el) {
  const y = histMonth.getFullYear(), m = histMonth.getMonth();
  const first = new Date(y, m, 1);
  const daysIn = new Date(y, m + 1, 0).getDate();
  const todayK = dateKey(new Date());
  const now = new Date();
  let cells = WEEKDAYS.map(d => `<div class="wd">${d[0]}</div>`).join('');
  for (let i = 0; i < weekdayIdx(first); i++) cells += `<div class="empty"></div>`;
  let sumDone = 0, sumTotal = 0, fullDays = 0, countedDays = 0;
  for (let d = 1; d <= daysIn; d++) {
    const date = new Date(y, m, d);
    const dk = dateKey(date);
    let cls = '';
    if (date <= now) {
      const { total, done } = dayStats(date);
      if (total) {
        const p = done / total;
        cls = p >= 1 ? 'p3' : p >= .5 ? 'p2' : p > 0 ? 'p1' : '';
        sumDone += done; sumTotal += total; countedDays++; if (p >= 1) fullDays++;
      }
    }
    const mood = data.notes?.[dk]?.mood;
    cells += `<div class="${cls} ${dk === todayK ? 'today' : ''}" data-day="${dk}">${d}${mood ? `<span class="mood" style="background:${MOOD_COLORS[mood - 1]}"></span>` : ''}</div>`;
  }
  const monthName = first.toLocaleDateString('sv-SE', { month: 'long', year: 'numeric' });
  const atCurrent = y === now.getFullYear() && m === now.getMonth();
  const monthNotes = Object.entries(data.notes || {}).filter(([k, n]) => k.startsWith(`${y}-${pad(m + 1)}`) && (n.text?.trim() || n.mood)).sort().reverse();
  const recent = lastDays(14);
  el.innerHTML = `<div class="daynav"><button class="arrow" data-act="prev">‹</button><div class="mid"><strong style="text-transform:capitalize">${monthName}</strong></div>
    <button class="arrow" data-act="next" ${atCurrent ? 'disabled' : ''}>›</button></div>
    <div class="card"><div class="hist">${cells}</div></div>
    <div class="card"><div class="stat"><span>Tagna doser</span><b>${sumDone} av ${sumTotal}${sumTotal ? ` · ${Math.round(sumDone / sumTotal * 100)} %` : ''}</b></div>
    <div class="stat"><span>Dagar med allt taget</span><b>${fullDays} av ${countedDays}</b></div>
    <div class="stat"><span>Senaste 14 dagarna</span><b>${recent.full} av ${recent.counted} dagar med allt 🌿</b></div></div>
    ${monthNotes.length ? `<div class="card"><h3>Mående och anteckningar</h3>${monthNotes.map(([k, n]) => `<div class="stat" style="display:block"><span class="muted small">${n.mood ? MOODS[n.mood - 1] + ' ' : ''}${parseKey(k).toLocaleDateString('sv-SE', { weekday: 'short', day: 'numeric', month: 'short' })}</span>${n.text?.trim() ? `<div>${esc(n.text)}</div>` : ''}</div>`).join('')}</div>` : ''}
    <p class="muted small" style="margin:0 4px 12px">Mörkare grön = större andel tagna. Pricken i hörnet är ditt mående. "Inte idag" räknas inte som missat. Tryck på en dag för att öppna den.</p>`;
  el.querySelector('[data-act=prev]').onclick = () => { histMonth = new Date(y, m - 1, 1); renderOverview(); };
  el.querySelector('[data-act=next]').onclick = () => { if (!atCurrent) { histMonth = new Date(y, m + 1, 1); renderOverview(); } };
  el.querySelectorAll('.hist [data-day]').forEach(c => { c.style.position = 'relative'; c.onclick = () => {
    const date = parseKey(c.dataset.day);
    if (date > now) return;
    viewDate = date; show('today');
  }; });
}
// Hur många av de senaste dagarna som allt togs – en missad dag nollställer inget. Idag räknas bara när den är klar.
function lastDays(n) {
  let full = 0, counted = 0;
  for (let i = 0; i < n; i++) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const { total, done } = dayStats(d);
    if (!total || (i === 0 && done < total)) continue;
    counted++; if (done >= total) full++;
  }
  return { full, counted };
}

// ---------- Tillskott ----------
function renderList() {
  const el = document.getElementById('view-list');
  const supps = activeSupps();
  const cost = supps.reduce((sum, s) => sum + monthlyCost(s), 0);
  const priced = supps.filter(s => s.active && monthlyCost(s) > 0).length;
  let html = `<div class="row between" style="margin:2px 0 10px"><h2 style="margin:0">Mina tillskott</h2>
    <button class="btn sm" data-act="add">+ Lägg till</button></div>`;
  if (cost) html += `<div class="card pad row between"><span>Kostnad</span><span><b>ca ${kr(cost)}/mån</b>
    <span class="muted small">${priced < supps.filter(s => s.active).length ? ` · ${priced} av ${supps.filter(s => s.active).length} har pris` : ''}</span></span></div>`;
  // Inköpslista: det som räcker mindre än SHOP_DAYS, grupperat per butik
  const toBuy = supps.map(s => ({ s, d: daysLeft(s) })).filter(x => x.d != null && x.d <= SHOP_DAYS).sort((a, b) => a.d - b.d);
  if (toBuy.length) {
    const stores = {};
    for (const x of toBuy) (stores[storeName(x.s.url)] = stores[storeName(x.s.url)] || []).push(x);
    html += `<div class="card shop"><h3>Att beställa</h3>${Object.entries(stores).map(([store, list]) => `<div class="group">
      <div class="store"><span>${esc(store)}</span></div>
      ${list.map(x => `<div class="line"><span>${esc(x.s.name)}</span><span class="${x.d <= LOW_DAYS ? 'low' : 'muted'}" style="${x.d <= LOW_DAYS ? 'color:var(--warn);font-weight:600' : ''}">
        ${x.d} d kvar${x.s.url ? ` · <a href="${esc(x.s.url)}" target="_blank" rel="noopener">Köp</a>` : ''}</span></div>`).join('')}</div>`).join('')}</div>`;
  }
  if (!supps.length) {
    html += `<div class="card pad empty-state">Inga tillskott än. Tryck på <b>Lägg till</b> eller klistra in en lista nedan.</div>`;
  } else {
    const groups = {};
    for (const s of supps) { const g = s.times?.[0] || 'Ingen tidpunkt'; (groups[g] = groups[g] || []).push(s); }
    for (const [g, list] of Object.entries(groups)) {

          <span class="qty"><button data-adj="${s.id}" data-n="-1" aria-label="En mindre">−</button><button data-adj="${s.id}" data-n="1" aria-label="En till">+</button></span>` : '';

    <div class="card"><details id="l-import"><summary>Klistra in en lista från Excel</summary>

function bindMoments(box) {
  let moments = data.moments.map(m => ({ ...m, orig: m.name }));
  const keep = () => box.querySelectorAll('.mrow').forEach((r, i) => {
    moments[i].name = r.querySelector('[data-mn]').value; moments[i].time = r.querySelector('[data-mt]').value;
    moments[i].optional = box.querySelector(`[data-mo="${i}"]`).checked;
  });
  const draw = () => {
    box.innerHTML = `<p class="muted small" style="margin-top:0">Ordningen här är ordningen på Idag. Med ett klockslag får du en påminnelse.
      En <b>valfri</b> tidpunkt (t.ex. PWO) visas bara de dagar du slår på den och räknas inte som missad annars.</p>` +
      (moments.length ? moments.map((m, i) => `<div class="mrow">
      <input type="text" data-mn value="${esc(m.name)}" placeholder="Namn"><input type="time" data-mt value="${esc(m.time)}">
      <button class="x" data-up="${i}" aria-label="Flytta upp" ${i ? '' : 'disabled'}>↑</button>
      <button class="x" data-down="${i}" aria-label="Flytta ner" ${i < moments.length - 1 ? '' : 'disabled'}>↓</button>
      <button class="x" data-rm="${i}" aria-label="Ta bort">×</button></div>
      <label class="mopt"><input type="checkbox" data-mo="${i}" ${m.optional ? 'checked' : ''}> Valfri – bara de dagar jag slår på den</label>`).join('') : '<p class="muted">Inga tidpunkter än.</p>') +
      `<div class="btns"><button class="btn ghost sm" data-act="addm">+ Tidpunkt</button><button class="btn sm" data-act="savem">Spara tidpunkter</button></div>`;
    box.querySelectorAll('[data-up]').forEach(b => b.onclick = () => { keep(); const i = +b.dataset.up; [moments[i - 1], moments[i]] = [moments[i], moments[i - 1]]; draw(); });
    box.querySelectorAll('[data-down]').forEach(b => b.onclick = () => { keep(); const i = +b.dataset.down; [moments[i + 1], moments[i]] = [moments[i], moments[i + 1]]; draw(); });
    box.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => {
      keep(); const m = moments[+b.dataset.rm];
      const users = activeSupps().filter(s => (s.times || []).includes(m.orig));
      if (users.length) { toast(`Används av ${users.map(s => s.name).join(', ')}`); return; }
      moments.splice(+b.dataset.rm, 1); draw();
    });
    box.querySelector('[data-act=addm]').onclick = () => { keep(); moments.push({ name: '', time: '', orig: null }); draw(); box.querySelectorAll('[data-mn]')[moments.length - 1].focus(); };
    box.querySelector('[data-act=savem]').onclick = () => {
      keep();
      moments = moments.filter(m => m.name.trim()).map(m => ({ ...m, name: m.name.trim() }));
      if (new Set(moments.map(m => m.name)).size !== moments.length) { toast('Två tidpunkter har samma namn'); return; }
      for (const m of moments) if (m.orig && m.orig !== m.name) renameMoment(m.orig, m.name);
      data.moments = moments.map(({ name, time, optional }) => ({ name, time, ...(optional ? { optional: true } : {}) }));
      data.momentsAt = Date.now();
      save(); toast('Tidpunkter sparade'); renderList();
    };
  };
  draw();
}

function bindImport(el) {
  let pending = [];
  el.querySelector('[data-act=preview]').onclick = () => {
    pending = rowsToSupps(el.querySelector('#s-paste').value);
    const box = el.querySelector('#s-preview');
    if (!pending.length) { box.innerHTML = '<p class="muted">Hittade inga rader med ett tillskottsnamn.</p>'; return; }
    box.innerHTML = `<div class="preview">${pending.map(r => `<div><b>${esc(r.name)}</b> <span class="muted">${esc([r.time, r.dose].filter(Boolean).join(' · '))}</span>
      <div class="muted small">${r.nutrients.length ? r.nutrients.map(n => `${esc(n.name)} ${fmt(n.amount)} ${n.unit}`).join(', ') : 'Inget innehåll tolkat'}</div></div>`).join('')}</div>
      <div class="btns"><button class="btn sm" data-act="doimport">Lägg in ${pending.length} tillskott</button></div>`;

  };
}

// ---------- Import från kalkylark ----------
function parseTSV(text) {
  const rows = []; let row = [], cell = '', q = false;
  text = text.replace(/\r\n?/g, '\n');
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"' && cell === '') q = true;
    else if (c === '\t') { row.push(cell); cell = ''; }
    else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  row.push(cell); rows.push(row);
  return rows.map(r => r.map(c => c.trim())).filter(r => r.some(Boolean));
}
function rowsToSupps(text) {
  const rows = parseTSV(text);
  if (!rows.length) return [];
  const head = rows[0].map(h => h.toLowerCase());
  const col = { contents: -1, time: -1, name: -1, dose: -1, brand: -1, url: -1 };
  const tests = [['contents', /innehåll|ingrediens/], ['url', /beställ|länk|url|köp/], ['brand', /märke|brand|tillverkare/],
    ['time', /tidpunkt|^tid|när|moment/], ['name', /kosttillskott|tillskott|namn|produkt/], ['dose', /mängd|dos|antal/]];
  for (const [f, rx] of tests) col[f] = head.findIndex((h, i) => rx.test(h) && !Object.values(col).includes(i));
  let body = rows;
  if (col.name >= 0) body = rows.slice(1);
  else Object.assign(col, { time: 0, name: 1, dose: 2, contents: 3, brand: 4, url: 5 }); // utan rubrikrad: samma ordning som mallen
  const get = (r, f) => col[f] >= 0 ? (r[col[f]] || '') : '';
  return body.filter(r => get(r, 'name')).map(r => {
    const name = get(r, 'name'), dose = get(r, 'dose'), contents = get(r, 'contents');
    return { name, dose, contents, brand: get(r, 'brand'), url: get(r, 'url'), time: get(r, 'time'),
      nutrients: parseContents(contents, name, dose) };
  });
}
function importSupps(list) {
  let added = 0, updated = 0;
  for (const [order, r] of list.entries()) {
    if (r.time && !data.moments.some(m => m.name === r.time)) {
      data.moments.push({ name: r.time, time: '', ...(/pwo|träning|workout/i.test(r.time) ? { optional: true } : {}) });
      data.momentsAt = Date.now();
    }
    const times = r.time ? [r.time] : [];
    const existing = Object.values(data.supplements).find(s => !s.deleted && s.name.toLowerCase() === r.name.toLowerCase()
      && (s.times || []).join() === times.join());
    const base = existing || { id: uid(), days: [0, 1, 2, 3, 4, 5, 6], note: '', active: true, stockBase: null, createdAt: Date.now() };
    data.supplements[base.id] = { ...base, order, name: r.name, dose: r.dose, perDose: num(r.dose) || base.perDose || null, contents: r.contents,
      brand: r.brand, url: r.url, nutrients: r.nutrients, times, deleted: false, updatedAt: Date.now() };
    existing ? updated++ : added++;
  }
  save();
  return { added, updated };
}

function renameMoment(from, to) {
  for (const s of Object.values(data.supplements)) {
    if (s.deleted || !(s.times || []).includes(from)) continue;
    s.times = s.times.map(t => t === from ? to : t); s.updatedAt = Date.now();
  }
  for (const entries of Object.values(data.log)) {
    for (const k of Object.keys(entries)) if (k.endsWith('@' + from)) {
      entries[k.slice(0, -from.length) + to] = entries[k];
      entries[k] = { v: false, t: entries[k].t + 1 };
    }
  }
  const n = lsGet(NOTIFIED_KEY, null);
  if (n?.slots) { n.slots = n.slots.map(s => s === from ? to : s); lsSet(NOTIFIED_KEY, n); }
}

        <a href="https://github.com/settings/tokens/new?scopes=gist&description=Dosa-appen" target="_blank" rel="noopener">github.com/settings/tokens</a>
        med bara behörigheten <b>gist</b> och klistra in den här. Gör samma sak på varje enhet. Token sparas bara på enheten.</p>
        <input type="password" id="s-token" placeholder="ghp_…" autocomplete="off">
        <div class="btns"><button class="btn sm" data-act="connect">Koppla</button></div>`}
    </div>
    <div class="card pad"><b>Säkerhetskopia</b>
      <div class="btns"><button class="btn ghost sm" data-act="export">Exportera fil</button>
      <button class="btn ghost sm" data-act="import">Importera fil</button></div>
      <input type="file" id="s-file" accept="application/json,.json" class="hidden">
    </div>
    <p class="muted small" style="margin:0 4px">Appen håller bara ordning på det du själv lägger in. Den ger inga råd om doser – fråga vården eller apoteket om du är osäker.</p>`;

  el.querySelector('#s-notify').onchange = async e => {
    data.settings.notify = e.target.checked;
    if (e.target.checked && 'Notification' in window && Notification.permission === 'default') {
      try { await Notification.requestPermission(); } catch {}
    }
    save(false); renderSettings();
  };
  el.querySelector('[data-act=testnotify]').onclick = async () => {
    if ('Notification' in window && Notification.permission === 'default') { try { await Notification.requestPermission(); } catch {} }
    const ok = await notify('Dosa', 'Så här ser en påminnelse ut.');
    if (!ok) toast('Notiser är inte tillgängliga här – påminnelsen visas i appen i stället');
    renderSettings();
  };
  el.querySelector('[data-act=connect]')?.addEventListener('click', async () => {
    const token = el.querySelector('#s-token').value.trim();
    if (!token) { toast('Klistra in en token'); return; }
    sync = { token, gistId: '', lastSync: 0 }; lsSet(SYNC_KEY, sync);
    await doSync(true); renderSettings();
  });
  el.querySelector('[data-act=syncnow]')?.addEventListener('click', async () => { await doSync(true); renderSettings(); });
  el.querySelector('[data-act=disconnect]')?.addEventListener('click', () => {
    if (!confirm('Koppla från synk på den här enheten? Datan i gisten och här finns kvar.')) return;
    sync = { token: '', gistId: '', lastSync: 0 }; lsSet(SYNC_KEY, sync); renderSettings(); renderSyncState();
  });
  el.querySelector('[data-act=export]').onclick = () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `dosa-${dateKey(new Date())}.json`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  const file = el.querySelector('#s-file');
  el.querySelector('[data-act=import]').onclick = () => file.click();
  file.onchange = async () => {
    const f = file.files[0]; if (!f) return;
    try {
      const incoming = JSON.parse(await f.text());
      if (!incoming.supplements || !incoming.log) throw new Error();
      data = merge(data, incoming); normalize(); save(); toast('Importerat'); render();
    } catch { toast('Filen kunde inte läsas'); }
  };
}

// ---------- Påminnelser ----------
function minutesOf(hhmm) { const [h, m] = hhmm.split(':').map(Number); return h * 60 + m; }
function dueUntaken() {
  // Otagna tillskott vars tidpunkt passerats inom de senaste 3 timmarna
  const now = new Date();
  const dk = dateKey(now);
  const mins = now.getHours() * 60 + now.getMinutes();
  return scheduledFor(now).filter(i => {
    const clock = momentTime(i.time);
    if (!clock || isTaken(dk, i.key) || isSkipped(dk, i.key)) return false;
    const diff = mins - minutesOf(clock);
    return diff >= 0 && diff <= 180;
  });
}
async function notify(title, body) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return false;
  try {
    const reg = await navigator.serviceWorker?.getRegistration();
    if (reg) await reg.showNotification(title, { body, icon: 'icon-180.png', tag: 'dosa' });
    else new Notification(title, { body, icon: 'icon-180.png' });
    return true;
  } catch { return false; }
}
function checkReminders() {
  const active = document.activeElement;
  if (currentView === 'today' && dateKey(viewDate) === dateKey(new Date()) && !(active && active.id === 't-note')) renderToday();
  if (!data.settings.notify) return;
  const now = new Date();
  const dk = dateKey(now);
  const notified = lsGet(NOTIFIED_KEY, {});
  if (notified.day !== dk) { notified.day = dk; notified.slots = []; }
  const mins = now.getHours() * 60 + now.getMinutes();
  // Notis bara för tidpunkter som just passerats (senaste 30 min), en gång per tidpunkt och dag
  const fresh = dueUntaken().filter(i => mins - minutesOf(momentTime(i.time)) <= 30 && !notified.slots.includes(i.time));
  if (!fresh.length) return;
  const slots = [...new Set(fresh.map(i => i.time))];
  notify(`Dags: ${slots.join(', ')}`, fresh.map(i => i.s.name + (i.s.dose ? ` – ${i.s.dose}` : '')).join('\n'));
  if (document.visibilityState === 'visible') toast('Dags för: ' + fresh.map(i => i.s.name).join(', '));
  notified.slots.push(...slots);
  lsSet(NOTIFIED_KEY, notified);
}

// ---------- Synk ----------
function merge(a, b) {
  const out = { supplements: { ...a.supplements }, log: {}, notes: { ...(a.notes || {}) }, settings: a.settings || { notify: false } };
  for (const [id, s] of Object.entries(b.supplements || {})) {
    if (!out.supplements[id] || (s.updatedAt || 0) > (out.supplements[id].updatedAt || 0)) out.supplements[id] = s;
  }
  for (const src of [a.log || {}, b.log || {}]) {
    for (const [dk, entries] of Object.entries(src)) {
      out.log[dk] = out.log[dk] || {};
      for (const [k, e] of Object.entries(entries)) {
        if (!out.log[dk][k] || (e.t || 0) > (out.log[dk][k].t || 0)) out.log[dk][k] = e;
      }
    }
  }
  for (const [dk, n] of Object.entries(b.notes || {})) if (!out.notes[dk] || (n.t || 0) > (out.notes[dk].t || 0)) out.notes[dk] = n;
  const bNewer = (b.momentsAt || 0) > (a.momentsAt || 0);
  out.moments = (bNewer ? b.moments : a.moments) || [];
  out.momentsAt = Math.max(a.momentsAt || 0, b.momentsAt || 0);
  out.seededAt = a.seededAt || b.seededAt;
  return out;
}
async function gh(path, opts = {}) {
  const res = await fetch('https://api.github.com' + path, {
    ...opts,
    headers: { Authorization: `Bearer ${sync.token}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json', ...(opts.headers || {}) },
    cache: 'no-store'
  });
  if (res.status === 401) throw new Error('Token ogiltig');
  if (res.status === 403 || res.status === 404) {
    if (path.startsWith('/gists/')) { const e = new Error('Gist saknas'); e.missing = true; throw e; }
    throw new Error('Token saknar gist-behörighet');
  }
  if (!res.ok) throw new Error('GitHub svarade ' + res.status);
  return res.json();
}
async function findGist() {
  for (let page = 1; page <= 10; page++) {
    const list = await gh(`/gists?per_page=100&page=${page}`);
    const hit = list.find(g => g.files && g.files[GIST_FILE] && g.description === GIST_DESC);
    if (hit) return hit.id;
    if (list.length < 100) break;
  }
  return '';
}
function payload() {
  const { settings, ...rest } = data; // inställningar är per enhet
  return JSON.stringify({ ...rest, app: 'tillskott', version: 3 });
}
let syncing = false, syncError = '', syncTimer = null, syncAgain = false;
function scheduleSync() {
  if (!sync.token) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => doSync(false), 1500);
  renderSyncState('pending');
}
async function doSync(manual) {
  if (!sync.token) return;
  if (syncing) { syncAgain = true; return; }
  syncing = true; syncError = ''; renderSyncState();
  try {
    if (!sync.gistId) sync.gistId = await findGist();
    let remote = null;
    if (sync.gistId) {
      try {
        const g = await gh(`/gists/${sync.gistId}`);
        const f = g.files[GIST_FILE];
        if (f) remote = JSON.parse(f.truncated ? await (await fetch(f.raw_url)).text() : f.content);
      } catch (e) { if (e.missing) sync.gistId = ''; else throw e; }
    }
    if (remote) {
      const snap = () => JSON.stringify([data.supplements, data.log, data.moments, data.notes]);
      const before = snap();
      data = merge(data, remote);
      normalize();
      save(false);
      if (snap() !== before && !['edit', 'list'].includes(currentView) && document.activeElement?.id !== 't-note') render();
    }
    const body = JSON.stringify({ description: GIST_DESC, files: { [GIST_FILE]: { content: payload() } } });
    if (sync.gistId) await gh(`/gists/${sync.gistId}`, { method: 'PATCH', body });
    else sync.gistId = (await gh('/gists', { method: 'POST', body: JSON.stringify({ description: GIST_DESC, public: false, files: { [GIST_FILE]: { content: payload() } } }) })).id;
    sync.lastSync = Date.now();
    lsSet(SYNC_KEY, sync);
    if (manual) toast('Synkat');
  } catch (e) {
    syncError = e.message || 'Synk misslyckades';
    if (manual) toast(syncError);
  } finally {
    syncing = false; renderSyncState();
    if (syncAgain) { syncAgain = false; doSync(false); }
  }
}
function renderSyncState(state) {
  const b = document.getElementById('syncState');
  if (!sync.token) { b.textContent = 'Ej synkad'; b.title = 'Synk ej kopplad – se Inställningar'; return; }
  if (syncing) b.textContent = 'Synkar…';
  else if (syncError) { b.textContent = '⚠︎ Synkfel'; b.title = syncError; }
  else if (state === 'pending') b.textContent = 'Ändrad…';
  else { b.textContent = '✓ Synkad'; b.title = sync.lastSync ? 'Senast ' + new Date(sync.lastSync).toLocaleString('sv-SE') : ''; }
}
document.getElementById('syncState').onclick = () => sync.token ? doSync(true) : show('settings');

// ---------- Övrigt ----------
let toastTimer;
function toast(msg, actionLabel, action) {
  const t = document.getElementById('toast');
  t.innerHTML = `<span>${esc(msg)}</span>${actionLabel ? `<button>${esc(actionLabel)}</button>` : ''}`;
  t.querySelector('button')?.addEventListener('click', () => { t.classList.remove('show'); action(); });
  t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), actionLabel ? 5000 : 2600);
}

let lastActive = Date.now();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { lastActive = Date.now(); return; }
  if (Date.now() - lastActive > 30 * 60e3) viewDate = new Date();
  if (!['edit', 'list', 'settings'].includes(currentView)) render();
  checkReminders(); if (sync.token) doSync(false);
});

if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});

normalize();
seedIfEmpty();
render();
checkReminders();
setInterval(checkReminders, 30e3);
if (sync.token) doSync(false);
</script>
